# Preview
#
# This workflow gates every PR to `main`: it runs the full test suite (`npm
# test` — all three vitest configs: Workers pool, node, import), the
# TypeScript type-check and the production build. The build is what refuses
# a route whose client code reaches a server-only module, which neither the
# tests nor the type-check see. Direct pushes to `main` are gated separately
# by tests.yml.
#
# @version v0.8.0

name: Preview

on:
  pull_request:
    branches: [main]

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
